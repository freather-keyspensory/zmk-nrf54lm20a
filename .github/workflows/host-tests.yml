name: Host protocol tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  uf2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test UF2 parser and converter with sanitizers
        run: bash firmware/bootloader/tests/run.sh
      - name: Compile Python tools
        run: python3 -m compileall -q firmware/bootloader/tools firmware/bootloader/tests firmware/port/scripts firmware/radio/tools
      - name: Test diagnostic radio frame parsing and sequence handling
        run: bash firmware/radio/tests/run.sh
  macos-collector:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile direct IOHID collector
        run: clang -std=c11 -O2 -Wall -Wextra -Werror firmware/radio/tools/capture_macos.c -framework IOKit -framework CoreFoundation -o "$RUNNER_TEMP/capture_macos"
