# No test PSK or plaintext fallback. Keep the existing ZMK ZMS format.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=49152
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-O3"
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=512
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=255
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_FORCE_MOUNT=n
CONFIG_ZMS_DATA_CRC=n
CONFIG_SETTINGS_ZMS_SECTOR_SIZE_MULT=1
CONFIG_SETTINGS_ZMS_CUSTOM_SECTOR_COUNT=n
